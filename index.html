<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Deadlock Timer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Cormorant+Garamond:wght@500;700&display=swap" rel="stylesheet">
<style>
  /* ponytail: картинки и шрифты грузятся из сети (cdn.deadlock.wiki, Google Fonts); офлайн будет текст и Georgia */
  :root { --bg:#120d0a; --panel:#1c1511; --fg:#fbe9d0; --dim:#8c7a66; --gold:#c9a25a; --soul:#7fd1b9; --soon:#e5533d; --done:#4a3d33; --line:#3a2c22; }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; color:var(--fg); padding:16px; font:18px/1.3 'Cormorant Garamond', Georgia, serif;
    background: radial-gradient(ellipse at top, #2a1d14 0%, var(--bg) 60%) fixed, var(--bg); }
  .wrap { max-width:760px; margin:0 auto; }
  #clock { font:900 clamp(64px,min(17vw,24vh),190px)/1 Cinzel, Georgia, serif; font-variant-numeric:tabular-nums; text-align:center; color:var(--fg);
    text-shadow:0 0 30px rgba(201,162,90,.25); margin:6px 0; }
  #souls { display:flex; align-items:center; justify-content:center; gap:10px; font:700 clamp(22px,4vw,38px) Cinzel, Georgia, serif; color:var(--soul); margin-bottom:14px; }
  #souls img { height:1.3em; }
  .controls { display:flex; gap:8px; justify-content:center; flex-wrap:wrap; margin-bottom:18px; }
  button { background:var(--panel); color:var(--fg); border:1px solid var(--line); padding:10px 16px; font:600 15px Cinzel, Georgia, serif; letter-spacing:1px; cursor:pointer; }
  button:hover, #pack:hover { border-color:var(--gold); }
  #pack { position:fixed; top:12px; right:12px; background:var(--panel); color:var(--fg); border:1px solid var(--line); padding:8px 10px; font:600 14px Cinzel, Georgia, serif; cursor:pointer; }
  #clock.paused { opacity:.4; }
  button.main { background:var(--gold); color:#1a120c; border-color:var(--gold); font-weight:900; font-size:19px; padding:12px 28px; }
  ul { list-style:none; padding:0; margin:0; border:1px solid var(--line); background:rgba(28,21,17,.7); }
  li { display:flex; align-items:center; gap:12px; padding:10px 14px; border-bottom:1px solid var(--line); font-size:clamp(19px,3vw,27px); font-weight:700; color:var(--dim); }
  li:last-child { border-bottom:0; }
  li img { width:34px; height:34px; object-fit:contain; flex:none; }
  li .n { flex:1; }
  li .t { font-family:Cinzel, Georgia, serif; font-variant-numeric:tabular-nums; font-size:.85em; }
  li.next { color:var(--fg); background:rgba(201,162,90,.08); }
  li.next .t { color:var(--gold); }
  li.soon, li.soon .t { color:var(--soon); background:rgba(229,83,61,.1); }
</style>
</head>
<body>
<div class="wrap">
<div id="clock">0:00</div>
<div id="souls"><img src="https://cdn.deadlock.wiki/Souls.png" alt="" onerror="this.remove()"><span id="soulsTxt">Души: —</span></div>
<select id="pack" aria-label="Озвучка">
  <option value="synth">Синтезатор</option>
  <option value="invoker">Invoker</option>
  <option value="slark">Slark</option>
</select>
<div class="controls">
  <button class="main" id="start">Старт (Space)</button>
  <button id="pause" title="Пауза (P)" aria-label="Пауза">⏸</button>
  <button data-shift="-60">−1м</button>
  <button data-shift="-10">−10с</button>
  <button data-shift="-1">−1с</button>
  <button data-shift="1">+1с</button>
  <button data-shift="10">+10с</button>
  <button data-shift="60">+1м</button>
  <button id="voice" title="Голос" aria-label="Голос вкл">🔊</button>
</div>
<ul id="events"></ul>
</div>

<script>
const IMG = n => 'https://cdn.deadlock.wiki/' + n;
// Секунды от начала матча, тайминги на патч ~май 2026. Респавн лагерей считается от зачистки — тут только первые спавны.
const EVENTS = [
  [120, 'T1 лес (малые лагеря)', IMG('MapEasyCampIcon.png'), 't1'],
  [180, 'Коробки, вазы, статуэтки', IMG('Ground_orb.png'), 'boxes'],
  [300, 'T2 лес (средние лагеря)', IMG('MapMediumCampIcon.png'), 't2'],
  [480, 'T3 лес (большие лагеря)', IMG('MapHardCampIcon.png'), 't3'],
  [480, 'Автоматы (Sinner\'s Sacrifice)', IMG('Sinner%27s_Sacrifice.png'), 'automates'],
];
// Урна: 10:00, затем каждые 5 мин
for (let t = 600; t <= 3600; t += 300) EVENTS.push([t, 'Урна душ', IMG('Soul_Urn.png'), 'urn']);
// Разломы (Unstable Rift): ~11:00, затем ~каждые 7 мин, разброс до ±1 мин
for (let t = 660; t <= 3600; t += 420) EVENTS.push([t, '~Разлом', IMG('Unstable_Rift.png'), 'rift']);
// Руны: каждые 5 мин
for (let t = 300; t <= 3600; t += 300) EVENTS.push([t, 'Руны', IMG('Powerup_gun.png'), 'runes']);
EVENTS.sort((a, b) => a[0] - b[0]);

// ponytail: примерный ориентир net worth (патч City Never Sleeps), не точные данные — подстрой под свой уровень
const SOULS = [[0, 0], [300, 3000], [600, 7500], [900, 12000], [1200, 16500], [1500, 21000], [1800, 26000], [2400, 35000], [3000, 44000]];

const WARN = 15; // за сколько секунд предупреждать
const SHOW = 6;  // сколько ближайших событий показывать
let startAt = null, pausedAt = null, voice = true;
let pack = 'invoker';
try { pack = localStorage.getItem('pack') || pack; } catch {}
if (!PACKS[pack]) pack = 'invoker';
let SOUNDS = PACKS[pack];
const announced = new Set();

const $ = id => document.getElementById(id);
const fmt = s => { s = Math.max(0, Math.floor(s)); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };
const now = () => startAt === null ? 0 : ((pausedAt ?? Date.now()) - startAt) / 1000;

function soulsAt(t) {
  for (let i = 1; i < SOULS.length; i++) {
    const [t0, s0] = SOULS[i - 1], [t1, s1] = SOULS[i];
    if (t <= t1) return s0 + (s1 - s0) * (t - t0) / (t1 - t0);
  }
  return SOULS.at(-1)[1];
}

function say(text) {
  if (!voice || !window.speechSynthesis) return;
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'ru-RU';
  speechSynthesis.speak(u);
}

// Клипы играют по очереди, чтобы события в одну минуту не накладывались
let queue = Promise.resolve();
function play(...keys) {
  if (!voice) return;
  for (const k of keys) queue = queue.then(() => new Promise(done => {
    const a = new Audio(SOUNDS[k]);
    a.onended = a.onerror = done;
    a.play().catch(done);
  }));
}

function render() {
  const t = now();
  $('clock').textContent = fmt(t);
  $('soulsTxt').textContent = (startAt === null ? 'Души: —' : 'Ориентир: ' + (Math.round(soulsAt(t) / 100) * 100).toLocaleString('ru-RU'));
  let shown = 0;
  $('events').innerHTML = EVENTS.map(([at, name, icon, sound], i) => {
    const left = at - t;
    if (left <= 0 || shown >= SHOW) return ''; // прошедшие прячем, показываем только ближайшие
    const time = fmt(at) + '  (через ' + fmt(left) + ')';
    const cls = left <= WARN ? 'soon' : shown === 0 ? 'next' : '';
    shown++;
    if (left <= WARN && startAt !== null && !announced.has(i)) { announced.add(i);
      if (SOUNDS[sound]) play(sound, 'in15'); // ponytail: клип всегда говорит «15 секунд», даже если сдвинул время ближе к событию
      else say(name.replace('~', '') + ' через ' + Math.ceil(left) + ' секунд');
    }
    return `<li class="${cls}"><img src="${icon}" alt="" onerror="this.style.visibility='hidden'"><span class="n">${name}</span><span class="t">${time}</span></li>`;
  }).join('');
}

let wakeLock = null;
async function keepAwake() { try { wakeLock = await navigator.wakeLock?.request('screen'); } catch {} }
document.addEventListener('visibilitychange', () => { if (startAt !== null && document.visibilityState === 'visible') keepAwake(); });

function toggleStart() {
  if (startAt === null) { startAt = Date.now(); announced.clear(); keepAwake(); SOUNDS.letsgo ? play('letsgo') : say('Поехали'); $('start').textContent = 'Сброс (Space)'; }
  else if (confirm('Сбросить таймер?')) { startAt = pausedAt = null; $('clock').classList.remove('paused'); $('pause').textContent = '⏸'; wakeLock?.release(); $('start').textContent = 'Старт (Space)'; }
  render();
}

$('start').onclick = toggleStart;
function togglePause() {
  if (startAt === null) return;
  if (pausedAt === null) pausedAt = Date.now();
  else { startAt += Date.now() - pausedAt; pausedAt = null; }
  $('clock').classList.toggle('paused', pausedAt !== null);
  $('pause').textContent = pausedAt === null ? '⏸' : '▶';
  render();
}
$('pause').onclick = togglePause;
document.addEventListener('keydown', e => {
  if (e.code === 'Space') { e.preventDefault(); toggleStart(); }
  if (e.code === 'KeyP') togglePause(); // e.code — работает и на русской раскладке
});
document.querySelectorAll('[data-shift]').forEach(b => b.onclick = () => {
  if (startAt === null) return;
  startAt -= b.dataset.shift * 1000; // +1с = матч идёт на секунду дольше
  announced.clear();
  for (const [i, [at]] of EVENTS.entries()) if (at - now() <= 0) announced.add(i);
  render();
});
$('pack').value = pack;
$('pack').onchange = e => {
  pack = e.target.value; SOUNDS = PACKS[pack];
  try { localStorage.setItem('pack', pack); } catch {}
  SOUNDS.letsgo ? play('letsgo') : say('Поехали'); // прослушать выбранную озвучку
};
$('voice').onclick = () => { voice = !voice; $('voice').textContent = voice ? '🔊' : '🔇'; $('voice').ariaLabel = 'Голос ' + (voice ? 'вкл' : 'выкл'); };

setInterval(render, 250);
render();
</script>
</body>
</html>
